<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>땀 브러쉬</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
#app{display:flex;flex-direction:column;width:100%;height:100%;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:52px;background:#1c1c1e;border-bottom:0.5px solid #2a2a2a;flex-shrink:0;position:relative;z-index:30;}
.tb-left{display:flex;align-items:center;gap:10px;}
.tb-right{display:flex;align-items:center;gap:8px;}
.tb-btn{width:38px;height:38px;border-radius:50%;background:#2c2c2e;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;}
.tb-btn:active{background:#3a3a3c;}
.tb-btn.active{background:#0a84ff;}
.tb-btn svg{pointer-events:none;}
#sidebar{position:absolute;left:0;top:52px;bottom:0;width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#1c1c1e;border-right:0.5px solid #2a2a2a;z-index:20;padding:20px 0;}
.slider-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;height:160px;}
.slider-label{font-size:9px;color:#555;letter-spacing:.04em;font-family:-apple-system,sans-serif;text-align:center;line-height:1.3;}
.vslider{-webkit-appearance:none;appearance:none;writing-mode:vertical-lr;direction:rtl;width:28px;height:120px;background:#2c2c2e;border-radius:14px;outline:none;cursor:pointer;}
.vslider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#adadaf;cursor:pointer;}
#cw{position:absolute;left:52px;top:52px;right:0;bottom:0;overflow:hidden;background:#000;}
/* 드로잉 캔버스 */
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}

/* ── 웹캠 모드 ── */
#cam-wrap{position:absolute;inset:0;display:none;flex-direction:column;}
#cam-wrap.show{display:flex;}
#cam-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
#cam-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#cam-bar{position:absolute;bottom:0;left:0;right:0;padding:16px;display:flex;justify-content:center;gap:16px;background:linear-gradient(transparent,rgba(0,0,0,.7));}
.cam-btn{background:rgba(44,44,46,.9);border:0.5px solid #3a3a3c;border-radius:24px;color:#fff;font-size:14px;font-family:-apple-system,sans-serif;padding:10px 22px;cursor:pointer;}
.cam-btn.primary{background:#0a84ff;border-color:#0a84ff;}
#opacity-ctrl{display:flex;align-items:center;gap:10px;}
#opacity-ctrl span{font-size:12px;color:#aaa;font-family:-apple-system,sans-serif;}
#ov-slider{-webkit-appearance:none;appearance:none;width:100px;height:3px;border-radius:2px;background:#3a3a3c;outline:none;}
#ov-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;cursor:pointer;}
/* 카메라 권한 안내 */
#cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-family:-apple-system,sans-serif;text-align:center;padding:32px;}
#cam-msg p{font-size:15px;color:#aaa;line-height:1.6;}
#cam-msg button{background:#0a84ff;border:none;border-radius:12px;color:#fff;font-size:15px;padding:12px 28px;cursor:pointer;font-family:-apple-system,sans-serif;}

/* 브러쉬 패널 */
#brush-panel{position:absolute;top:0;right:0;bottom:0;width:320px;background:#2c2c2e;border-left:0.5px solid #3a3a3c;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50;overflow:hidden;}
#brush-panel.open{transform:translateX(0);}
#panel-header{padding:14px 16px 10px;border-bottom:0.5px solid #3a3a3c;flex-shrink:0;}
#panel-header p{font-size:17px;font-weight:600;color:#fff;font-family:-apple-system,sans-serif;}
#brush-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#brush-list::-webkit-scrollbar{display:none;}
.bl-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:0.5px solid #3a3a3c;cursor:pointer;transition:background .12s;}
.bl-item:active{background:#3a3a3c;}
.bl-item.on{background:#0a84ff22;}
.bl-preview{width:100px;height:44px;flex-shrink:0;border-radius:8px;background:#1c1c1e;overflow:hidden;}
.bl-preview canvas{width:100%;height:100%;display:block;}
.bl-info{flex:1;min-width:0;}
.bl-num{font-size:10px;color:#888;font-family:-apple-system,sans-serif;margin-bottom:3px;letter-spacing:.04em;}
.bl-name{font-size:15px;color:#fff;font-family:-apple-system,sans-serif;font-weight:500;margin-bottom:2px;}
.bl-item.on .bl-name{color:#4ca8ff;}
.bl-sub{font-size:11px;color:#666;font-family:-apple-system,sans-serif;line-height:1.4;}
#hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .5s;}
#hint p{font-size:15px;color:#2a2a2a;margin:0 0 6px;font-family:-apple-system,sans-serif;}
#hint p.s{font-size:12px;color:#1e1e1e;}
#overlay{position:absolute;inset:0;background:transparent;z-index:40;display:none;}
#overlay.show{display:block;}
/* ── 월드 갤러리 ── */
#world-modal{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column;overflow:hidden;}
#world-modal.show{display:flex;}
#wm-top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#0a0a0a;border-bottom:0.5px solid #1a1a1a;flex-shrink:0;}
#wm-top h2{font-size:15px;font-weight:500;color:#fff;font-family:-apple-system,sans-serif;margin:0;}
.wm-btn{background:transparent;border:0.5px solid #2a2a2a;border-radius:8px;color:#888;font-size:12px;font-family:-apple-system,sans-serif;padding:7px 14px;cursor:pointer;}
.wm-btn:hover{border-color:#555;color:#fff;}
.wm-btn.primary{background:#0a84ff;border-color:#0a84ff;color:#fff;}
#wm-grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;align-content:start;}
#wm-grid::-webkit-scrollbar{display:none;}
.wm-card{background:#111;border:0.5px solid #1e1e1e;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .2s;}
.wm-card:hover{border-color:#444;}
.wm-card canvas{display:block;width:100%;aspect-ratio:3/2;}
.wm-card-info{padding:10px 12px;}
.wm-card-name{font-size:13px;font-weight:500;color:#ddd;font-family:-apple-system,sans-serif;margin:0 0 3px;}
.wm-card-meta{font-size:11px;color:#555;font-family:-apple-system,sans-serif;margin:0;}
.wm-empty{grid-column:1/-1;text-align:center;color:#333;font-family:-apple-system,sans-serif;font-size:14px;padding:60px 0;}
/* 업로드 모달 */
#upload-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;}
#upload-modal.show{display:flex;}
#upload-box{background:#111;border:0.5px solid #2a2a2a;border-radius:16px;padding:24px;width:min(360px,90vw);}
#upload-box h3{font-size:16px;font-weight:500;color:#fff;font-family:-apple-system,sans-serif;margin:0 0 16px;}
#upload-preview{width:100%;aspect-ratio:3/2;border-radius:8px;overflow:hidden;margin-bottom:14px;background:#0a0a0a;}
#upload-preview canvas{width:100%;height:100%;display:block;}
#name-input{width:100%;background:#1a1a1a;border:0.5px solid #2a2a2a;border-radius:8px;color:#fff;font-size:14px;font-family:-apple-system,sans-serif;padding:10px 12px;outline:none;margin-bottom:14px;}
#name-input::placeholder{color:#444;}
#name-input:focus{border-color:#555;}
.upload-row{display:flex;gap:8px;}
.upload-row button{flex:1;}
@keyframes panelIn{from{opacity:0;transform:scale(.92) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tb-left">
      <button class="tb-btn" onclick="undo()" aria-label="실행취소">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <line x1="17" y1="10" x2="4" y2="10" stroke="#adadaf" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M9 5 L4 10 L9 15" stroke="#adadaf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="tb-btn" onclick="clearCanvas()" aria-label="지우기">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M5 5 L15 15 M15 5 L5 15" stroke="#adadaf" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="tb-right">
      <!-- 브러쉬 버튼 -->
      <button class="tb-btn" id="brush-btn" onclick="togglePanel()" aria-label="브러쉬 선택">
        <svg width="22" height="22" viewBox="0 0 653.62 595.28" xmlns="http://www.w3.org/2000/svg">
          <path fill="#adadaf" d="M578.41,71.73c1.69,1.77-10.32,18.61-12.16,21.27-35.6,51.63-82.71,105.84-124.06,153.4-33.15,38.13-76.15,89.4-114.82,120.72-13.4,10.85-28.33,16.36-43.13,24.79-1.14.41-2.22.39-3.26-.28-.65-.41-6.15-10.95-7.74-13.23-6.93-9.93-15.26-19.01-25.26-25.86,14.82-33.97,42.83-58.44,69.93-82.72,58-51.97,123.4-103.05,186.33-149.01,17.02-12.43,34.99-25.84,52.69-37.13,2.32-1.48,20.55-12.91,21.47-11.95Z"/>
          <path fill="#adadaf" d="M74.41,509.86c-.47-2.59.37-1.54,1.42-2.07,17.46-8.91,30.38-19.71,42.48-35.36,18-23.28,24.07-52.8,43.42-75.35,14.53-16.93,45.4-36.94,67.29-23.36,10.31,6.4,34.6,34.56,33.98,46.68-.46,8.97-10.37,33.55-14.75,42.24-34.97,69.43-108.03,70.77-173.84,47.21Z"/>
        </svg>
      </button>
      <!-- 내보내기 버튼 -->
      <button class="tb-btn" id="export-btn" onclick="openExport()" aria-label="월드에 올리기" style="position:relative;">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <line x1="10" y1="13" x2="10" y2="3" stroke="#adadaf" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M6.5 6.5 L10 3 L13.5 6.5" stroke="#adadaf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 8.5 L3.5 8.5 Q3 8.5 3 9 L3 16.5 Q3 17 3.5 17 L16.5 17 Q17 17 17 16.5 L17 9 Q17 8.5 16.5 8.5 L14 8.5" stroke="#adadaf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- 웹캠 버튼 -->
      <button class="tb-btn" id="cam-btn" onclick="openCam()" aria-label="웹캠으로 보기">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="4" stroke="#adadaf" stroke-width="1.4"/>
          <circle cx="10" cy="10" r="7.5" stroke="#adadaf" stroke-width="1.4"/>
          <circle cx="15.5" cy="4.5" r="1.2" fill="#adadaf"/>
        </svg>
      </button>
      <!-- 월드 갤러리 버튼 -->
      <button class="tb-btn" id="world-btn" onclick="openWorld()" aria-label="월드 갤러리">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#adadaf" stroke-width="1.4"/><path d="M10 2 Q7 6 7 10 Q7 14 10 18" stroke="#adadaf" stroke-width="1" fill="none"/><path d="M10 2 Q13 6 13 10 Q13 14 10 18" stroke="#adadaf" stroke-width="1" fill="none"/><line x1="2" y1="10" x2="18" y2="10" stroke="#adadaf" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div id="sidebar">
    <div class="slider-wrap">
      <div class="slider-label">크기</div>
      <input type="range" class="vslider" id="sz" min="4" max="80" value="22">
    </div>
    <div class="slider-wrap">
      <div class="slider-label">투명도</div>
      <input type="range" class="vslider" id="op" min="10" max="100" value="65">
    </div>
  </div>

  <div id="cw">
    <!-- 드로잉 캔버스 -->
    <canvas id="c"></canvas>
    <div id="hint">
      <p>브러쉬를 선택하고 그려보세요</p>
      <p class="s">느리게 · 빠르게 · 아래로 — 움직임마다 달라져요</p>
    </div>

    <!-- 웹캠 모드 -->
    <div id="cam-wrap">
      <video id="cam-video" autoplay playsinline muted></video>
      <!-- 손 감지 + 패턴 합성 캔버스 -->
      <canvas id="cam-overlay"></canvas>
      <!-- 대기 화면: 패턴 원형 프리뷰 + 안내 -->
      <div id="cam-guide" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;">
        <div style="position:relative;width:200px;height:200px;margin-bottom:24px;">
          <canvas id="pattern-preview" width="200" height="200" style="border-radius:50%;display:block;"></canvas>
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,0.3);"></div>
        </div>
        <p id="cam-hint-text" style="font-size:15px;color:rgba(255,255,255,0.7);font-family:-apple-system,sans-serif;letter-spacing:.02em;">손을 화면에 올려주세요</p>
      </div>
      <!-- 하단 컨트롤 -->
      <div id="cam-bar">
        <button class="cam-btn" onclick="closeCam()">← 돌아가기</button>

        <button class="cam-btn primary" onclick="saveShot()">저장</button>
      </div>
    </div>

    <div id="overlay" onclick="closePanel()"></div>
  </div>

  <div id="brush-panel">
    <div id="panel-header"><p>브러쉬 라이브러리</p></div>
    <div id="brush-list"></div>
  </div>
</div>

<script>
(function(){

var BRUSHES=[
  {num:'01',name:'지하철 · 버스',sub:'번진 수채화 · 회색→황갈색',colors:['#CE93D8','#b470c0','#9a50a8'],
    draw:function(x,y,p,t){var c=pick(this.colors,t),s=bSize*(0.7+p*0.6),a=bOpacity*(0.3+p*0.2);for(var i=0;i<6;i++){var ox=x+(Math.random()-.5)*s*1.4,oy=y+(Math.random()-.5)*s*1.4,rs=s*(0.5+Math.random()*.8),g=ctx.createRadialGradient(ox,oy,0,ox,oy,rs);g.addColorStop(0,rgba(c,a));g.addColorStop(0.6,rgba(c,a*.4));g.addColorStop(1,rgba(c,0));ctx.beginPath();ctx.arc(ox,oy,rs,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();}},
    preview:function(pc){for(var i=0;i<8;i++){var x=10+i*12,y=22+(Math.random()-.5)*8,r=8+Math.random()*6,g=pc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(206,147,216,.7)');g.addColorStop(1,'rgba(206,147,216,0)');pc.beginPath();pc.arc(x,y,r,0,Math.PI*2);pc.fillStyle=g;pc.fill();}}
  },
  {num:'02',name:'헬스장 · 운동기구',sub:'소금 결정 · 흰색→투명',colors:['#AFBEC5','#92a8b2','#728e97'],
    draw:function(x,y,p,t){
      var c=pick(this.colors,t),s=bSize*(0.6+p*0.6),a=Math.min(bOpacity*(0.75+p*0.25),0.98);
      /* 소금 결정 입자 — 각진 불규칙 다각형 */
      var nCrystal=Math.floor(8+p*20);
      for(var i=0;i<nCrystal;i++){
        var ox=x+(Math.random()-.5)*s*2.0;
        var oy=y+(Math.random()-.5)*s*2.0;
        /* 결정 크기 — 크고 작은 게 섞임 */
        var cs=s*(0.04+Math.random()*Math.random()*0.28);
        var rot=Math.random()*Math.PI*0.5;
        var ca=a*(0.5+Math.random()*0.5);
        ctx.save();
        ctx.translate(ox,oy);
        ctx.rotate(rot);
        /* 각진 사각형~불규칙 다각형 */
        var nv=4+Math.floor(Math.random()*3);
        ctx.beginPath();
        for(var v=0;v<nv;v++){
          var vang=(v/nv)*Math.PI*2+(Math.random()-.5)*0.5;
          var vr=cs*(0.7+Math.random()*0.5);
          if(v===0) ctx.moveTo(Math.cos(vang)*vr, Math.sin(vang)*vr);
          else ctx.lineTo(Math.cos(vang)*vr, Math.sin(vang)*vr);
        }
        ctx.closePath();
        ctx.fillStyle=rgba(c,ca);
        ctx.fill();
        /* 결정 테두리 — 선명한 엣지 */
        ctx.strokeStyle=rgba(c,Math.min(ca*1.3,1));
        ctx.lineWidth=0.3+Math.random()*0.5;
        ctx.stroke();
        ctx.restore();
      }
      /* 미세 먼지 입자 — 아주 작은 것들 */
      var nDust=Math.floor(12+p*24);
      for(var i=0;i<nDust;i++){
        var ox=x+(Math.random()-.5)*s*2.2;
        var oy=y+(Math.random()-.5)*s*2.2;
        var ds=s*(0.01+Math.random()*0.04);
        ctx.save();
        ctx.translate(ox,oy);
        ctx.rotate(Math.random()*Math.PI);
        ctx.beginPath();
        ctx.rect(-ds,-ds*0.6,ds*2,ds*1.2);
        ctx.fillStyle=rgba(c,a*(0.4+Math.random()*0.5));
        ctx.fill();
        ctx.restore();
      }},
    preview:function(pc){
      for(var i=0;i<30;i++){
        var ox=8+Math.random()*84, oy=4+Math.random()*36;
        var cs=1.5+Math.random()*Math.random()*9;
        var rot=Math.random()*Math.PI*0.5;
        pc.save();pc.translate(ox,oy);pc.rotate(rot);
        var nv=4+Math.floor(Math.random()*2);
        pc.beginPath();
        for(var v=0;v<nv;v++){
          var vang=(v/nv)*Math.PI*2+(Math.random()-.5)*0.4;
          var vr=cs*(0.7+Math.random()*0.4);
          if(v===0) pc.moveTo(Math.cos(vang)*vr,Math.sin(vang)*vr);
          else pc.lineTo(Math.cos(vang)*vr,Math.sin(vang)*vr);
        }
        pc.closePath();
        pc.fillStyle='rgba(175,190,197,'+(0.5+Math.random()*0.5)+')';
        pc.fill();
        pc.strokeStyle='rgba(175,190,197,.9)';pc.lineWidth=.3;pc.stroke();
        pc.restore();
      }
    }
  },
  {num:'03',name:'옷에 묻은 땀자국',sub:'물감 얼룩 · 차갑고 어두운 파랑',colors:['#4FC3F7','#28a8e0','#1888c0'],
    draw:function(x,y,p,t){
      var c=pick(this.colors,t),s=bSize*(0.9+p*0.5),a=bOpacity*(0.55+p*0.2);
      /* spacing — 일정 확률로만 찍힘 (띄엄띄엄) */
      if(Math.random()>0.22) return;
      /* 찌그러진 얼룩 하나 */
      ctx.save();
      ctx.translate(x+(Math.random()-.5)*s*0.5, y+(Math.random()-.5)*s*0.5);
      ctx.scale(0.7+Math.random()*0.7, 0.5+Math.random()*0.5);
      ctx.rotate(Math.random()*Math.PI*2);
      var gr=ctx.createRadialGradient(0,0,0,0,0,s);
      gr.addColorStop(0,rgba(c,a));
      gr.addColorStop(0.5,rgba(c,a*0.55));
      gr.addColorStop(0.85,rgba(c,a*0.15));
      gr.addColorStop(1,rgba(c,0));
      ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);
      ctx.fillStyle=gr;ctx.fill();
      ctx.restore();},
    preview:function(pc){
      /* 찌그러진 얼룩 */
      pc.save();pc.translate(38,20);pc.scale(1.3,0.6);
      var gr=pc.createRadialGradient(0,0,0,0,0,18);
      gr.addColorStop(0,'rgba(79,195,247,.8)');gr.addColorStop(0.5,'rgba(79,195,247,.4)');gr.addColorStop(1,'rgba(79,195,247,0)');
      pc.beginPath();pc.arc(0,0,18,0,Math.PI*2);pc.fillStyle=gr;pc.fill();
      pc.restore();

function camLoop(){

/* ══════════════════════════════
   캠 인터랙션 모드 시스템
══════════════════════════════ */
var camMode='drop'; /* tattoo / glass / stamp / drop */

/* 모드별 상태 */
var drops=[]; /* 물방울 파티클 */
var prevHandPos=null; /* 이전 손 위치 */



/* ── 물방울 ── */
function renderDrop(landmarks,cw,ch){
  var tips=[4,8,12,16,20];
  tips.forEach(function(ti){
    if(Math.random()<0.35){
      var tx=(1-landmarks[ti].x)*cw;
      var ty=landmarks[ti].y*ch;
      var px=Math.min(canvas.width-1,Math.floor(landmarks[ti].x*canvas.width));
      var py=Math.min(canvas.height-1,Math.floor(landmarks[ti].y*canvas.height));
      var id=canvas.getContext('2d').getImageData(px,py,1,1).data;
      var col=id[3]>20?'rgba('+id[0]+','+id[1]+','+id[2]+',':'rgba(200,160,255,';
      /* 여러 방울 한 번에 */
      var n=Math.floor(1+Math.random()*3);
      for(var k=0;k<n;k++){
        drops.push({
          x:tx+rnd(-8,8),
          y:ty+rnd(-4,4),
          vx:rnd(-0.8,0.8),
          vy:2+Math.random()*4,
          r:5+Math.random()*9,
          col:col,
          alpha:0.92,
          trail:[],
          stretch:1+Math.random()*0.8 /* 세로로 늘어나는 정도 */
        });
      }
    }
  });

  drops=drops.filter(function(d){return d.alpha>0.03&&d.y<ch+80;});

  drops.forEach(function(d){
    d.trail.push({x:d.x,y:d.y});
    if(d.trail.length>40) d.trail.shift(); /* 꼬리 더 길게 */
    d.x+=d.vx;
    d.vy+=0.35; /* 중력 강하게 */
    d.vx*=0.98;
    d.y+=d.vy;
    d.alpha-=0.006;

    /* 꼬리 — 굵고 길게 */
    if(d.trail.length>3){
      camCtx.save();
      var trailLen=d.trail.length;
      for(var i=1;i<trailLen;i++){
        var t=i/trailLen;
        var tw=d.r*(0.25+t*0.55);
        camCtx.beginPath();
        camCtx.moveTo(d.trail[i-1].x,d.trail[i-1].y);
        camCtx.lineTo(d.trail[i].x,d.trail[i].y);
        camCtx.strokeStyle=d.col+(d.alpha*t*0.55)+')';
        camCtx.lineWidth=tw*2;
        camCtx.lineCap='round';
        camCtx.stroke();
      }
      camCtx.restore();
    }

    /* 물방울 본체 — 세로로 늘어난 타원 */
    camCtx.save();
    var speed=Math.min(d.vy/8,1);
    var scaleY=1+speed*d.stretch;
    camCtx.translate(d.x,d.y);
    camCtx.scale(1,scaleY);
    /* 그라데이션 */
    var g=camCtx.createRadialGradient(-d.r*0.25,-d.r*0.25,0,0,0,d.r);
    g.addColorStop(0,d.col+(d.alpha*0.95)+')');
    g.addColorStop(0.5,d.col+(d.alpha*0.75)+')');
    g.addColorStop(1,d.col+(d.alpha*0.1)+')');
    camCtx.beginPath();
    camCtx.arc(0,0,d.r,0,Math.PI*2);
    camCtx.fillStyle=g;
    camCtx.fill();
    /* 하이라이트 */
    camCtx.beginPath();
    camCtx.arc(-d.r*0.28,-d.r*0.3,d.r*0.32,0,Math.PI*2);
    camCtx.fillStyle='rgba(255,255,255,'+(d.alpha*0.6)+')';
    camCtx.fill();
    camCtx.restore();

    /* 바닥 튀김 효과 */
    if(d.y>ch-20&&d.alpha>0.3){
      camCtx.save();
      camCtx.beginPath();
      camCtx.ellipse(d.x,ch-8,d.r*1.4,d.r*0.3,0,0,Math.PI*2);
      camCtx.fillStyle=d.col+(d.alpha*0.25)+')';
      camCtx.fill();
      camCtx.restore();
    }
  });

  /* 손 — 삼각형 메시 타투 (마디별로 구부러짐) */
  renderHandMesh(landmarks,cw,ch);
}

/* ── 손 삼각형 메시 타투 ── */
function renderHandMesh(landmarks,cw,ch){
  function lp(i){return{x:(1-landmarks[i].x)*cw,y:landmarks[i].y*ch};}

  /* 손가락별 마디 인덱스 */
  var fingers=[
    [0,1,2,3,4],   /* 엄지 */
    [0,5,6,7,8],   /* 검지 */
    [0,9,10,11,12],/* 중지 */
    [0,13,14,15,16],/* 약지 */
    [0,17,18,19,20] /* 새끼 */
  ];

  /* 손바닥 중심 */
  var palmPts=[0,1,5,9,13,17].map(lp);
  var palmCx=palmPts.reduce(function(s,p){return s+p.x;},0)/palmPts.length;
  var palmCy=palmPts.reduce(function(s,p){return s+p.y;},0)/palmPts.length;
  var palmC={x:palmCx,y:palmCy};

  /* 패턴 소스 정규화 함수 */
  var sw=canvas.width, sh=canvas.height;
  function srcPt(p){
    /* 손 전체 bbox 기준으로 패턴 좌표 계산 */
    var xs=[];var ys=[];
    for(var i=0;i<21;i++){xs.push((1-landmarks[i].x)*cw);ys.push(landmarks[i].y*ch);}
    var mnX=Math.min.apply(null,xs),mxX=Math.max.apply(null,xs);
    var mnY=Math.min.apply(null,ys),mxY=Math.max.apply(null,ys);
    var nx=(p.x-mnX)/(mxX-mnX+1);
    var ny=(p.y-mnY)/(mxY-mnY+1);
    return{x:nx*sw, y:ny*sh};
  }

  /* 손 전체 마스크 먼저 클립 */
  camCtx.save();
  drawHandMask(camCtx,landmarks,cw,ch);
  camCtx.clip();
  camCtx.globalAlpha=0.82;

  /* 각 손가락 마디별 삼각형 그리기 */
  fingers.forEach(function(finger){
    for(var seg=0;seg<finger.length-2;seg++){
      var a,b,c,d2;
      if(seg===0){
        /* 손바닥 → 첫 마디: 손바닥 중심 포함 삼각형 */
        a=lp(finger[1]);
        b=lp(finger[Math.min(finger.length-1,2)]);
        var adj=finger===fingers[0]?lp(finger[2]):palmC;
        drawTrianglePatch(a,b,adj,srcPt(a),srcPt(b),srcPt(adj));
      }
      a=lp(finger[seg+1]);
      b=lp(finger[Math.min(seg+2,finger.length-1)]);
      /* 마디 너비 보정 */
      var perp=perpOffset(a,b,8*(1-seg*0.15));
      var al={x:a.x-perp.x,y:a.y-perp.y};
      var ar={x:a.x+perp.x,y:a.y+perp.y};
      var bl={x:b.x-perp.x,y:b.y-perp.y};
      var br={x:b.x+perp.x,y:b.y+perp.y};
      drawTrianglePatch(al,ar,bl,srcPt(al),srcPt(ar),srcPt(bl));
      drawTrianglePatch(ar,br,bl,srcPt(ar),srcPt(br),srcPt(bl));
    }
  });

  /* 손바닥 중앙 채우기 */
  var palmRing=[0,1,5,9,13,17,0].map(lp);
  for(var pi=0;pi<palmRing.length-2;pi++){
    drawTrianglePatch(palmC,palmRing[pi],palmRing[pi+1],
      srcPt(palmC),srcPt(palmRing[pi]),srcPt(palmRing[pi+1]));
  }

  camCtx.restore();

  /* 손 윤곽 */
  camCtx.save();
  drawHandMask(camCtx,landmarks,cw,ch);
  camCtx.strokeStyle='rgba(255,255,255,0.18)';
  camCtx.lineWidth=1.5;
  camCtx.stroke();
  camCtx.restore();
}

function perpOffset(a,b,dist){
  var dx=b.x-a.x,dy=b.y-a.y;
  var len=Math.hypot(dx,dy)||1;
  return{x:-dy/len*dist,y:dx/len*dist};
}

function drawTrianglePatch(d0,d1,d2,s0,s1,s2){
  var m=solveAffine(s0,s1,s2,d0,d1,d2);
  if(!m) return;
  camCtx.save();
  camCtx.beginPath();
  camCtx.moveTo(d0.x,d0.y);
  camCtx.lineTo(d1.x,d1.y);
  camCtx.lineTo(d2.x,d2.y);
  camCtx.closePath();
  camCtx.clip();
  camCtx.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
  camCtx.drawImage(canvas,0,0);
  camCtx.restore();
}

function rnd(a,b){return a+Math.random()*(b-a);}

function drawHandMask(ctx,landmarks,cw,ch){
  var outline=[0,1,2,3,4,20,19,18,17,16,15,14,13,12,11,10,9,8,7,6,5];
  ctx.beginPath();
  outline.forEach(function(i,idx){
    var l=landmarks[i];
    var x=(1-l.x)*cw, y=l.y*ch;
    if(idx===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });
  ctx.closePath();
}

/* ── perspective warp — 4점 변환으로 패턴을 손 평면에 맞춤 ── */
function warpPatternToHand(ctx,landmarks,cw,ch){
  /* 손바닥 4 코너 랜드마크: 손목(0), 검지MCP(5), 새끼MCP(17), 중지끝(12) 기준 */
  function lp(i){ return{x:(1-landmarks[i].x)*cw, y:landmarks[i].y*ch}; }

  var wrist  = lp(0);
  var idx    = lp(5);   /* 검지 MCP */
  var pinky  = lp(17);  /* 새끼 MCP */
  var mid    = lp(9);   /* 중지 MCP */

  /* 손바닥 중심 */
  var palmCx=(wrist.x+idx.x+pinky.x+mid.x)/4;
  var palmCy=(wrist.y+idx.y+pinky.y+mid.y)/4;

  /* 손바닥 너비/높이 */
  var palmW=Math.hypot(idx.x-pinky.x, idx.y-pinky.y);
  var palmH=Math.hypot(wrist.x-mid.x, wrist.y-mid.y)*1.3;

  /* z값으로 기울기 추정 */
  var zWrist=landmarks[0].z||0;
  var zMid  =landmarks[9].z||0;
  var zIdx  =landmarks[5].z||0;
  var zPink =landmarks[17].z||0;

  /* 손이 기울어진 정도 → perspective 오프셋 */
  var tiltLR=(zIdx-zPink)*80;   /* 좌우 기울기 */
  var tiltUD=(zWrist-zMid)*80;  /* 상하 기울기 */

  /* 패턴 소스 좌표 (전체 캔버스) */
  var sw=canvas.width, sh=canvas.height;

  /* 목적지 4점 — perspective 왜곡 적용 */
  var dst=[
    {x:idx.x  +tiltLR*0.5, y:idx.y  -tiltUD*0.5},  /* 좌상 */
    {x:pinky.x -tiltLR*0.5, y:pinky.y-tiltUD*0.5}, /* 우상 */
    {x:wrist.x -tiltLR*0.5, y:wrist.y+tiltUD*0.5}, /* 우하 */
    {x:wrist.x +tiltLR*0.5+palmW*0.1, y:wrist.y+tiltUD*0.5} /* 좌하 */
  ];

  /* 손 마스크 클리핑 */
  ctx.save();
  drawHandMask(ctx,landmarks,cw,ch);
  ctx.clip();
  ctx.globalAlpha=0.85;

  /* 4분할 삼각형으로 패턴 warp */
  var triangles=[
    /* 좌상 삼각형 */
    { src:[{x:0,y:0},{x:sw,y:0},{x:sw/2,y:sh/2}],
      dst:[dst[0],dst[1],{x:(dst[0].x+dst[1].x+dst[2].x+dst[3].x)/4,y:(dst[0].y+dst[1].y+dst[2].y+dst[3].y)/4}]},
    /* 우상 */
    { src:[{x:sw,y:0},{x:sw,y:sh},{x:sw/2,y:sh/2}],
      dst:[dst[1],dst[2],{x:(dst[0].x+dst[1].x+dst[2].x+dst[3].x)/4,y:(dst[0].y+dst[1].y+dst[2].y+dst[3].y)/4}]},
    /* 우하 */
    { src:[{x:sw,y:sh},{x:0,y:sh},{x:sw/2,y:sh/2}],
      dst:[dst[2],dst[3],{x:(dst[0].x+dst[1].x+dst[2].x+dst[3].x)/4,y:(dst[0].y+dst[1].y+dst[2].y+dst[3].y)/4}]},
    /* 좌하 */
    { src:[{x:0,y:sh},{x:0,y:0},{x:sw/2,y:sh/2}],
      dst:[dst[3],dst[0],{x:(dst[0].x+dst[1].x+dst[2].x+dst[3].x)/4,y:(dst[0].y+dst[1].y+dst[2].y+dst[3].y)/4}]}
  ];

  triangles.forEach(function(tri){
    ctx.save();
    /* 목적지 삼각형으로 클립 */
    ctx.beginPath();
    ctx.moveTo(tri.dst[0].x,tri.dst[0].y);
    ctx.lineTo(tri.dst[1].x,tri.dst[1].y);
    ctx.lineTo(tri.dst[2].x,tri.dst[2].y);
    ctx.closePath();
    ctx.clip();

    /* 소스→목적지 affine 변환 행렬 */
    var s=tri.src, d=tri.dst;
    var m=solveAffine(s[0],s[1],s[2],d[0],d[1],d[2]);
    if(m) ctx.transform(m[0],m[1],m[2],m[3],m[4],m[5]);
    ctx.drawImage(canvas,0,0);
    ctx.restore();
  });

  ctx.restore();
}

/* affine 변환 행렬 계산 (3점 → 3점) */
function solveAffine(s0,s1,s2,d0,d1,d2){
  var x0=s0.x,y0=s0.y,x1=s1.x,y1=s1.y,x2=s2.x,y2=s2.y;
  var det=x0*(y1-y2)+x1*(y2-y0)+x2*(y0-y1);
  if(Math.abs(det)<1e-10) return null;
  var a=(d0.x*(y1-y2)+d1.x*(y2-y0)+d2.x*(y0-y1))/det;
  var b=(d0.x*(x2-x1)+d1.x*(x0-x2)+d2.x*(x1-x0))/det;
  var c=(d0.x*(x1*y2-x2*y1)+d1.x*(x2*y0-x0*y2)+d2.x*(x0*y1-x1*y0))/det;
  var d=(d0.y*(y1-y2)+d1.y*(y2-y0)+d2.y*(y0-y1))/det;
  var e=(d0.y*(x2-x1)+d1.y*(x0-x2)+d2.y*(x1-x0))/det;
  var f=(d0.y*(x1*y2-x2*y1)+d1.y*(x2*y0-x0*y2)+d2.y*(x0*y1-x1*y0))/det;
  return [a,d,b,e,c,f];
}


/* 비디오를 캔버스에 cover 방식으로 그리기 (비율 유지, 납작함 없음) */
function drawVideoCover(ctx,cw,ch){
  var vw=video.videoWidth||cw, vh=video.videoHeight||ch;
  var scale=Math.max(cw/vw, ch/vh);
  var dw=Math.round(vw*scale), dh=Math.round(vh*scale);
  var dx=Math.round((cw-dw)/2), dy=Math.round((ch-dh)/2);
  ctx.save();
  ctx.scale(-1,1);
  ctx.translate(-cw,0);
  ctx.drawImage(video,-dx,dy,dw,dh);
  ctx.restore();
}
/* ── 손 감지 결과 처리 ── */
function onHandResults(results){
  var cw=camCanvas.width, ch=camCanvas.height;
  var cx=cw/2, cy=ch/2;
  var R=Math.min(cw,ch)*0.28;
  var guide=document.getElementById('cam-guide');
  var hintText=document.getElementById('cam-hint-text');

  camCtx.clearRect(0,0,cw,ch);

  /* 웹캠 배경 — 비율 유지 */
  drawVideoCover(camCtx,cw,ch);

  if(results.multiHandLandmarks&&results.multiHandLandmarks.length>0){
    if(guide) guide.style.opacity='0';
    var landmarks=results.multiHandLandmarks[0];

    renderDrop(landmarks,cw,ch);

  } else {
    if(guide) guide.style.opacity='1';
    if(hintText) hintText.textContent='손을 화면에 올려주세요';
    prevHandPos=null;

    /* 물방울 모드 — 손 없어도 계속 떨어짐 */
    if(camMode==='drop'&&drops.length>0){
      drops=drops.filter(function(d){return d.alpha>0.05&&d.y<ch+50;});
      drops.forEach(function(d){
        d.trail.push({x:d.x,y:d.y});
        if(d.trail.length>18) d.trail.shift();
        d.x+=d.vx; d.vy+=0.18; d.y+=d.vy; d.alpha-=0.004;
        if(d.trail.length>2){
          camCtx.save();
          camCtx.beginPath();
          camCtx.moveTo(d.trail[0].x,d.trail[0].y);
          d.trail.forEach(function(p){camCtx.lineTo(p.x,p.y);});
          camCtx.strokeStyle=d.col+(d.alpha*0.35)+')';
          camCtx.lineWidth=d.r*0.9;camCtx.lineCap='round';camCtx.stroke();
          camCtx.restore();
        }
        camCtx.save();
        camCtx.beginPath();camCtx.arc(d.x,d.y,d.r,0,Math.PI*2);
        camCtx.fillStyle=d.col+(d.alpha*0.8)+')';camCtx.fill();
        camCtx.restore();
      });
    }

    /* 손 없을 때 — 동그라미 안에 패턴 */
    camCtx.save();
    camCtx.beginPath();
    camCtx.arc(cx,cy,R,0,Math.PI*2);
    camCtx.clip();
    camCtx.globalAlpha=0.5;
    camCtx.drawImage(canvas,cx-R,cy-R,R*2,R*2);
    camCtx.restore();

    camCtx.save();
    camCtx.beginPath();
    camCtx.arc(cx,cy,R,0,Math.PI*2);
    camCtx.strokeStyle='rgba(255,255,255,0.5)';
    camCtx.lineWidth=2;
    camCtx.stroke();
    camCtx.restore();
  }
}

/* ── MediaPipe 로드 ── */
function startHandTracking(){
  if(window.Hands){initHands();return;}
  var s1=document.createElement('script');
  s1.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';
  s1.onload=function(){
    var s2=document.createElement('script');
    s2.src='https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';
    s2.onload=initHands;
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
}

function initHands(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;} /* 기존 루프 종료 */
  handsDetector=new Hands({locateFile:function(f){
    return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;
  }});
  handsDetector.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.6});
  handsDetector.onResults(onHandResults);

  function detect(){
    if(!stream) return;
    handsDetector.send({image:video}).then(function(){
      rafId=requestAnimationFrame(detect);
    });
  }
  detect();
}

function openCam(){
  camWrap.classList.add('show');
  resizeCamCanvas();
  /* 패턴 프리뷰 원 그리기 */
  var pv=document.getElementById('pattern-preview');
  if(pv&&canvas.width>0){
    var pc=pv.getContext('2d'),S=200;
    pc.clearRect(0,0,S,S);
    pc.save();
    pc.beginPath();pc.arc(S/2,S/2,S/2,0,Math.PI*2);pc.clip();
    pc.fillStyle='#111';pc.fillRect(0,0,S,S);
    pc.globalAlpha=0.5;
    pc.drawImage(canvas,0,0,S,S);
    pc.restore();
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
    .then(function(s){
      stream=s;
      video.srcObject=s;
      video.play();
      video.addEventListener('loadedmetadata',function(){
        resizeCamCanvas();
        /* 먼저 기본 루프 시작 (MediaPipe 로드 전) */
        camLoop();
        /* MediaPipe 로드 — 완료되면 손 감지 모드로 전환 */
        startHandTracking();
      },{once:true});
    })
    .catch(function(err){
      console.warn('카메라 오류:',err);
      alert('카메라 권한을 허용해주세요.\nSafari: 설정 > Safari > 카메라 > 허용');
    });
}
window.openCam=openCam;

function resizeCamCanvas(){
  var r=camWrap.getBoundingClientRect();
  var W=r.width||window.innerWidth;
  var H=r.height||window.innerHeight;
  camCanvas.width=W;
  camCanvas.height=H;
  camCanvas.style.width=W+'px';
  camCanvas.style.height=H+'px';
  camCanvas.style.position='absolute';
  camCanvas.style.top='0';
  camCanvas.style.left='0';
  camCanvas.style.transform='none';
}

function closeCam(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  if(handsDetector){handsDetector.close();handsDetector=null;}
  if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
  video.srcObject=null;
  camWrap.classList.remove('show');
  /* 상태 초기화 */
  glassCanvas=null; stamps=[]; drops=[]; prevHandPos=null;
  camMode='tattoo';
  document.querySelectorAll('.cam-mode-btn').forEach(function(b){b.classList.remove('active');});
  var tb=document.getElementById('mode-tattoo');
  if(tb) tb.classList.add('active');
}
window.closeCam=closeCam;

function saveShot(){
  var tmp=document.createElement('canvas');

  tc.save();tc.scale(-1,1);tc.translate(-tmp.width,0);

  /* 이미지 URL에서 픽셀 색상 샘플링 → 브러쉬 비율 추정 */

        Object.keys(BRUSH_COLORS).forEach(function(k){
          var c=BRUSH_COLORS[k];
          var d=(r-c.r)*(r-c.r)+(g-c.g)*(g-c.g)+(b-c.b)*(b-c.b);
          if(d<bestD){bestD=d;best=k;}
        });
        if(best&&bestD<25000) scores[best]++;
      }
      /* 비율 계산 — 0.5% 이상만 포함 */
      var ratio={};
      if(total>0){
        Object.keys(scores).forEach(function(k){
          var pct=Math.round(scores[k]/total*100);
          if(pct>=1) ratio[k]=pct;
        });
      }
      callback(ratio);
    };
    img.onerror=function(){callback({});};
    img.src=imageUrl;
  }

  function confirmPlace(xPct,yPct,wPct){
    var g=document.getElementById('place-guide');
    if(g)g.parentNode.removeChild(g);

    /* 색상 분석 후 저장 */
    analyzeBrushRatio(pendingImage, function(ratio){
      var works=getWorks();
      works.push({
        name:pendingName,
        desc:pendingDesc||'',
        image:pendingImage,
        timestamp:Date.now(),
        brushNum:String((window._getCurrentBrush?window._getCurrentBrush():0)+1).padStart(2,'0'),
        brushRatio:ratio,
        x:xPct, y:yPct, w:wPct||20
      });
      if(works.length>80)works=works.slice(-80);
      saveWorks(works);
      pendingImage=null; pendingName=null; pendingDesc=null;
      renderWorld();
    });
  };

  /* 자유 캔버스 렌더링 */
  /* 브러쉬 메타 데이터 */
  var BRUSH_META={
    '01':{name:'지하철·버스', tags:['찝찝함','불쾌함','밀폐'], trait:'경계 없이 번지는 수채화 질감'},
    '02':{name:'헬스장·운동기구', tags:['소금기','건조함','결정'], trait:'각진 소금 결정이 촘촘하게 박힘'},
    '03':{name:'옷 땀자국', tags:['창피함','수축','시각적'], trait:'띄엄띄엄 맺히는 스테인 얼룩'},
    '04':{name:'식사 시간', tags:['기름짐','노폐물','번들'], trait:'윤기 있는 기름진 글레이즈'},
    '05':{name:'축구·운동 모임', tags:['연대감','확산','열기'], trait:'멀리까지 퍼지는 에어브러쉬 입자'},
    '06':{name:'운동·무대', tags:['성취감','생명력','발광'], trait:'퍼지는 동그라미 입자들'},
    '07':{name:'데오드란트·쿨링티슈', tags:['소거','쿨링','격자'], trait:'화장솜 엠보싱 눌림 무늬'},
    '08':{name:'밀폐공간·강의실', tags:['열기축적','건조','가루'], trait:'chalky한 분필 가루 질감'},
    '09':{name:'호감·처음 만남', tags:['긴장','설렘','떨림'], trait:'가늘게 떨리는 연필 해칭 선'},
    '10':{name:'수영장·물 공간', tags:['청량함','유동','해소'], trait:'동심원으로 퍼지는 물 파문'},
    '11':{name:'사회적 시선·낙인', tags:['시선','판단','긁힘'], trait:'흰 베이스 위 비비드 스크래치'},
    '12':{name:'화장 무너짐·번들거림', tags:['번들','관리','광택'], trait:'기름 얼룩 위 흰 광점 산포'}
  };

  function renderWorld(){
    var container=document.getElementById('wm-items');
    var hint=document.getElementById('wm-hint');
    var countEl=document.getElementById('wm-count');
    container.innerHTML='';
    hidePanel();
    var works=getWorks();
    countEl.textContent=works.length ? works.length+'개의 문양' : '';
    hint.style.display=works.length?'none':'block';

    works.forEach(function(w,i){
      var el=document.createElement('div');
      el.style.cssText=[
        'position:absolute',
        'left:'+w.x+'%',
        'top:'+w.y+'%',
        'width:'+(w.w||18)+'%',
        'cursor:pointer',
        'transition:transform .12s',
        'z-index:'+(10+i),
        'mix-blend-mode:screen'
      ].join(';');

      var img=document.createElement('img');
      img.src=w.image;
      img.style.cssText='display:block;width:100%;image-rendering:high-quality;';
      img.decoding='async';
      el.appendChild(img);
      container.appendChild(el);

      function showPanel(e){
        e.stopPropagation();
        /* 이전 선택 강조 제거 */
        document.querySelectorAll('.wm-selected').forEach(function(el2){el2.classList.remove('wm-selected');el2.style.outline='none';});
        /* 현재 선택 강조 */
        el.style.outline='2px solid rgba(255,255,255,0.5)';
        el.style.outlineOffset='2px';
        el.classList.add('wm-selected');
        var rect=el.getBoundingClientRect();
        var worldRect=document.getElementById('wm-world').getBoundingClientRect();
      var bx=(rect.left-worldRect.left-pz.x)/pz.scale;
      var by=(rect.top-worldRect.top-pz.y)/pz.scale;
      var rw=rect.width/pz.scale;
      var rh=rect.height/pz.scale;
      openDetailPanel(w, rect.left-worldRect.left, rect.top-worldRect.top, rect.width, rect.height);
      }
      el.addEventListener('click',showPanel);
      el.addEventListener('touchend',function(e){e.preventDefault();showPanel(e);},{passive:false});

      /* hover 오버레이 */
      var overlay=document.createElement('div');
      overlay.style.cssText='position:absolute;inset:0;background:rgba(255,255,255,0.12);opacity:0;transition:opacity .2s;pointer-events:none;border-radius:4px;';
      el.appendChild(overlay);
      el.addEventListener('mouseenter',function(){overlay.style.opacity='1';});
      el.addEventListener('mouseleave',function(){overlay.style.opacity='0';});
    });

    document.getElementById('wm-world').onclick=function(e){
      if(e.target===document.getElementById('wm-world')||e.target===container) hidePanel();
    };

    /* ── pan / zoom ── */
    initPanZoom();
  }

  var _pzInited=false;
  var pz={x:0,y:0,scale:1};

  function applyTransform(){
    var items=document.getElementById('wm-items');
    if(items) items.style.transform='translate('+pz.x+'px,'+pz.y+'px) scale('+pz.scale+')';
  }

  function clampPZ(){
    var world=document.getElementById('wm-world');
    if(!world) return;
    var ww=world.offsetWidth, wh=world.offsetHeight;
    var minX=ww*(1-pz.scale), minY=wh*(1-pz.scale);
    pz.x=Math.min(0,Math.max(pz.x, minX));
    pz.y=Math.min(0,Math.max(pz.y, minY));
  }

  function initPanZoom(){
    if(_pzInited) return;
    _pzInited=true;
    var world=document.getElementById('wm-world');

    /* 마우스 휠 — 줌 */
    world.addEventListener('wheel',function(e){
      e.preventDefault();
      var rect=world.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      var delta=e.deltaY>0?0.9:1.1;
      var newScale=Math.min(4, Math.max(0.5, pz.scale*delta));
      var ratio=newScale/pz.scale;
      pz.x=mx-(mx-pz.x)*ratio;
      pz.y=my-(my-pz.y)*ratio;
      pz.scale=newScale;
      clampPZ(); applyTransform();
    },{passive:false});

    /* 터치 — 핀치 줌 + 팬 */
    var lastTouches=null;
    world.addEventListener('touchstart',function(e){
      if(e.touches.length>=2){
        lastTouches=Array.from(e.touches).map(function(t){return{x:t.clientX,y:t.clientY};});
      } else if(e.touches.length===1){
        lastTouches=[{x:e.touches[0].clientX,y:e.touches[0].clientY}];
      }
    },{passive:true});

    world.addEventListener('touchmove',function(e){
      e.preventDefault();
      if(e.touches.length===2 && lastTouches && lastTouches.length===2){
        var t0={x:e.touches[0].clientX,y:e.touches[0].clientY};
        var t1={x:e.touches[1].clientX,y:e.touches[1].clientY};
        var rect=world.getBoundingClientRect();

        /* 현재/이전 두 손가락 거리 */
        var prevDist=Math.hypot(lastTouches[1].x-lastTouches[0].x, lastTouches[1].y-lastTouches[0].y);
        var currDist=Math.hypot(t1.x-t0.x, t1.y-t0.y);
        var scaleD=prevDist>0?currDist/prevDist:1;

        /* 두 손가락 중심 */
        var cx=(t0.x+t1.x)/2-rect.left;
        var cy=(t0.y+t1.y)/2-rect.top;
        var pcx=(lastTouches[0].x+lastTouches[1].x)/2-rect.left;
        var pcy=(lastTouches[0].y+lastTouches[1].y)/2-rect.top;

        var newScale=Math.min(4,Math.max(0.5,pz.scale*scaleD));
        var ratio=newScale/pz.scale;
        pz.x=cx-(pcx-pz.x)*ratio+(cx-pcx);
        pz.y=cy-(pcy-pz.y)*ratio+(cy-pcy);
        pz.scale=newScale;
        lastTouches=[t0,t1];
        clampPZ(); applyTransform();

      } else if(e.touches.length===1 && lastTouches && lastTouches.length===1){
        var dx=e.touches[0].clientX-lastTouches[0].x;
        var dy=e.touches[0].clientY-lastTouches[0].y;
        pz.x+=dx; pz.y+=dy;
        lastTouches=[{x:e.touches[0].clientX,y:e.touches[0].clientY}];
        clampPZ(); applyTransform();
      }
    },{passive:false});

    world.addEventListener('touchend',function(e){
      if(e.touches.length===0) lastTouches=null;
      else lastTouches=Array.from(e.touches).map(function(t){return{x:t.clientX,y:t.clientY};});
    },{passive:true});

    /* 마우스 드래그 팬 */
    var dragging=false, dragStart={x:0,y:0};
    world.addEventListener('mousedown',function(e){
      if(e.target.closest && e.target.closest('#detail-panel')) return;
      dragging=true; dragStart={x:e.clientX-pz.x,y:e.clientY-pz.y};
      world.style.cursor='grabbing';
    });
    window.addEventListener('mousemove',function(e){
      if(!dragging) return;
      pz.x=e.clientX-dragStart.x;
      pz.y=e.clientY-dragStart.y;
      clampPZ(); applyTransform();
    });
    window.addEventListener('mouseup',function(){
      dragging=false;
      var w=document.getElementById('wm-world');
      if(w) w.style.cursor='default';
    });
  }

  function buildBarsHtml(ratio){
    if(!ratio||!Object.keys(ratio).length) return '';
    var sorted=Object.keys(ratio).sort(function(a,b){return ratio[b]-ratio[a];}).slice(0,4);
    var bars=sorted.map(function(k){
      var m=BRUSH_META[k]||{name:'브러쉬 '+k};
      var pct=ratio[k];
      var c=BRUSH_COLORS[k]||{r:120,g:120,b:120};
      return '<div style="margin-bottom:6px;">'+
        '<div style="display:flex;justify-content:space-between;margin-bottom:2px;">'+
          '<span style="font-size:11px;color:#777;font-family:-apple-system,sans-serif;">'+m.name+'</span>'+
          '<span style="font-size:11px;color:#555;font-family:-apple-system,sans-serif;">'+pct+'%</span>'+
        '</div>'+
        '<div style="background:#1a1a1a;border-radius:3px;height:4px;overflow:hidden;">'+
          '<div style="height:4px;border-radius:3px;width:'+Math.min(pct,100)+'%;background:rgb('+c.r+','+c.g+','+c.b+');"></div>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<p style="font-size:11px;color:#555;font-family:-apple-system,sans-serif;margin:0 0 7px;letter-spacing:.04em;text-transform:uppercase;">브러쉬 구성</p>'+bars;
  }

  function openDetailPanel(w, bx, by, rw, rh){
    hidePanel();
    var world=document.getElementById('wm-world');
    var ww=world.offsetWidth, wh=world.offsetHeight;

    var brushNum=w.brushNum||'01';
    var meta=BRUSH_META[brushNum]||{name:'알 수 없음',tags:[],trait:'독특한 텍스처'};

    var panel=document.createElement('div');
    panel.id='detail-panel';

    var pw=205;
    var px=bx+rw+10;
    var py=by;
    if(px+pw>ww-10) px=bx-pw-10;
    if(px<6) px=6;
    if(py+280>wh-10) py=wh-290;
    if(py<6) py=6;

    panel.style.cssText=[
      'position:absolute','left:'+px+'px','top:'+py+'px','width:'+pw+'px',
      'background:rgba(14,14,14,.97)','border:0.5px solid #2a2a2a',
      'border-radius:14px','padding:14px','z-index:100',
      'pointer-events:auto','animation:panelIn .18s ease'
    ].join(';');

    var ratio=w.brushRatio||{};
    var barsHtml=buildBarsHtml(ratio);
    var descHtml=w.desc?
      '<p style="font-size:12px;color:#aaa;font-family:-apple-system,sans-serif;margin:0 0 10px;line-height:1.6;font-style:italic;">'+escP(w.desc)+'</p>':'';
    var tagsHtml=meta.tags.map(function(t){
      return '<span style="display:inline-block;background:#1e1e1e;border:0.5px solid #2a2a2a;border-radius:20px;font-size:11px;color:#888;padding:3px 9px;margin:2px 3px 2px 0;">'+t+'</span>';
    }).join('');

    panel.innerHTML=
      '<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px;">'+
        '<div style="width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;border:0.5px solid #2a2a2a;background:repeating-conic-gradient(#1a1a1a 0% 25%,#111 0% 50%) 0 0/8px 8px;">'+
          '<img src="'+w.image+'" style="width:100%;height:100%;object-fit:cover;"/>'+
        '</div>'+
        '<p style="font-size:14px;font-weight:500;color:#fff;font-family:-apple-system,sans-serif;margin:0;line-height:1.3;">'+escP(w.name)+'</p>'+
      '</div>'+
      descHtml+
      '<div id="ratio-section">'+barsHtml+'</div>'+
      '<p style="font-size:11px;color:#555;font-family:-apple-system,sans-serif;margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase;">특징</p>'+
      '<p style="font-size:12px;color:#888;font-family:-apple-system,sans-serif;margin:0 0 10px;line-height:1.55;">'+meta.trait+'</p>'+
      '<div style="margin-bottom:10px;">'+tagsHtml+'</div>'+
      '<p style="font-size:10px;color:#333;font-family:-apple-system,sans-serif;margin:0;">'+new Date(w.timestamp).toLocaleDateString('ko-KR')+'</p>';

    var closeBtn=document.createElement('button');
    closeBtn.textContent='×';
    closeBtn.style.cssText='position:absolute;top:8px;right:10px;background:transparent;border:none;color:#444;font-size:16px;cursor:pointer;line-height:1;padding:0;';
    closeBtn.onclick=function(e){e.stopPropagation();hidePanel();};
    panel.appendChild(closeBtn);
    world.appendChild(panel);

    /* 기존 작품 실시간 분석 */
    if(!w.brushRatio||!Object.keys(w.brushRatio).length){
      analyzeBrushRatio(w.image,function(r){
        var sec=document.getElementById('ratio-section');
        if(sec) sec.innerHTML=buildBarsHtml(r);
      });
    }
  }



    function hidePanel(){
    var p=document.getElementById('detail-panel');
    if(p) p.parentNode.removeChild(p);
    document.querySelectorAll('.wm-selected').forEach(function(el2){el2.classList.remove('wm-selected');el2.style.outline='none';});
  }

  function escP(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function hideBubble(){hidePanel();}

  /* Enter 키 */
  document.addEventListener('DOMContentLoaded',function(){
    var ni=document.getElementById('name-input');
    if(ni) ni.addEventListener('keydown',function(e){if(e.key==='Enter')window.submitWork();});
  });

})();
</script>
